<center>

    <h1>Administrator Login</h1>

    <table width="40%" border="1" cellpadding="20" cellspacing="0">

        <tr bgcolor="#12355B">
            <th>
                <font color="white" size="5">
                    ADMIN LOGIN
                </font>
            </th>
        </tr>

        <tr>
            <td>

                <form action="{{ url_for('admin_login') }}" method="POST">
                    <p>
                        <b>Username</b>
                    </p>            
                    <input type="text"
                           name="username"
                           size="35"
                           placeholder="Enter username"
                           required>

                    <p>
                        <b>Password</b>
                    </p>

                    <input type="password"
                           name="password"
                           size="35"
                           placeholder="Enter password"
                           required>

                    <br><br>

                    <center>
                        <input type="submit"
                               value="LOGIN">
                    </center>

                </form>

            </td>
        </tr>

    </table>

    <br>

</center>
